version: '3.8'

services:
  wiremock:
    image: wiremock/wiremock:latest
    container_name: sdk-conformance-wiremock
    ports:
      - "8080:8080"
    volumes:
      - ./wiremock:/home/wiremock
    command: >
      --global-response-templating
      --verbose
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/__admin/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Future: Add containers for SDK runners when implemented
  # go-runner:
  #   build: ./runners/go
  #   depends_on:
  #     wiremock:
  #       condition: service_healthy
  #   environment:
  #     - WIREMOCK_URL=http://wiremock:8080
  #   volumes:
  #     - ./features:/app/features:ro

networks:
  default:
    name: sdk-conformance-network
